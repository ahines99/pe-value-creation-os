name: nightly-evals

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    env:
      PVC_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run pvc eval --suite all --gate --report var/eval-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report
          path: var/eval-report.*

  dependency-audit:
    # The same pip-audit gate CI runs on pull requests, run daily so a newly published advisory surfaces on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Dependency audit
        run: uv export --frozen --no-hashes --extra server --extra research --no-emit-project > requirements-audit.txt && uv run pip-audit -r requirements-audit.txt --strict

  live-model:
    # Live model evaluation (ADR 0005). Requires explicit paid-run opt-in and a configured API secret; failures gate this job.
    runs-on: ubuntu-latest
    if: ${{ vars.PVC_RUN_LIVE_EVALS == 'true' }}
    env:
      PVC_ENV: dev
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PVC_EGRESS_ALLOWLIST: api.anthropic.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Require live-model credential
        run: test -n "$ANTHROPIC_API_KEY"
      - run: uv run pvc eval --suite all --proposer model --gate --report var/eval-report-model.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report-model
          path: var/eval-report-model.*
