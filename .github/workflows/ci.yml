name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflows, shell, Compose, Terraform and alert rules
        run: bash infra/scripts/check-infrastructure.sh

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Build, initialize and seed the local showcase
        run: uv run python scripts/showcase.py up
      - name: Exercise session, evidence, approval, worker and KPI HTTP contracts
        run: uv run python infra/scripts/smoke_showcase.py
      - name: Check rendered portfolio across desktop, tablet and phone widths
        run: |
          uv run python scripts/capture_portfolio.py
          uv run python scripts/build_public_case.py
          uv run pvc public-diligence --input data/public/progress/financial-facts.json --growth data/public/progress/growth-context.json --peers data/public/progress/peer-context.json --output docs/portfolio/progress-baseline
          uv run pvc underwriting --input data/constructed/progress/underwriting.json --output docs/portfolio/underwriting
          uv run pvc operating-plan --input data/constructed/progress/operating-plan.json --underwriting data/constructed/progress/underwriting.json --output docs/portfolio/operating-plan
          uv run pvc case-history-demo --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --output docs/portfolio/case-history
          uv run pvc realization-demo --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --exercise data/constructed/progress/realization.json --output docs/portfolio/realization
          uv run pvc execution-demo --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --realization data/constructed/progress/realization.json --execution data/constructed/progress/execution.json --output docs/portfolio/execution
          uv run pvc operating-sources --sources data/constructed/progress/operating-sources.json --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --output docs/portfolio/operating-sources
          uv run pvc source-review-demo --underwriting "data/constructed/progress/underwriting.json" --operating-plan "data/constructed/progress/operating-plan.json" --realization "data/constructed/progress/realization.json" --execution "data/constructed/progress/execution.json" --sources "data/constructed/progress/operating-sources.json" --output docs/portfolio/source-review
          uv run pvc exit-review-demo --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --realization data/constructed/progress/realization.json --execution data/constructed/progress/execution.json --sources data/constructed/progress/operating-sources.json --facts data/public/progress/financial-facts.json --balances data/public/progress/balance-facts.json --valuation data/constructed/progress/historical-valuation.json --assumptions data/constructed/progress/exit-assumptions.json --output docs/portfolio/exit-review
          uv run pvc lineage-demo --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --realization data/constructed/progress/realization.json --execution data/constructed/progress/execution.json --sources data/constructed/progress/operating-sources.json --facts data/public/progress/financial-facts.json --balances data/public/progress/balance-facts.json --valuation data/constructed/progress/historical-valuation.json --assumptions data/constructed/progress/exit-assumptions.json --output docs/portfolio/lineage-review
          uv run pvc disclosure-history --input data/public/progress/sharefile-allocation-history.json --output docs/portfolio/disclosure-history
          uv run pvc restatement-history --input data/public/progress/accounting-restatement-history.json --output docs/portfolio/accounting-restatement
          uv run pvc historical-valuation --facts data/public/progress/financial-facts.json --balances data/public/progress/balance-facts.json --spec data/constructed/progress/historical-valuation.json --output docs/portfolio/historical-valuation
          uv run pvc decision-memo --brief data/constructed/progress/decision-brief.json --facts data/public/progress/financial-facts.json --growth data/public/progress/growth-context.json --peers data/public/progress/peer-context.json --underwriting data/constructed/progress/underwriting.json --operating-plan data/constructed/progress/operating-plan.json --balances data/public/progress/balance-facts.json --valuation data/constructed/progress/historical-valuation.json --output docs/portfolio/decision-memo --case-review docs/portfolio/lineage-review.json
          uv run pvc allocation-demo --underwriting data/constructed/progress/allocation-underwriting.json --operating-plan data/constructed/progress/allocation-plan.json --exercise data/constructed/progress/allocation-realization.json --sources data/constructed/progress/allocation-sources.json --output docs/portfolio/allocation-review
          uv run pvc allocation-demo --include-lineage --underwriting data/constructed/progress/allocation-underwriting.json --operating-plan data/constructed/progress/allocation-plan.json --exercise data/constructed/progress/allocation-realization.json --sources data/constructed/progress/allocation-sources.json --output docs/portfolio/allocation-lineage-review
          uv run pvc underwriting --input data/constructed/progress/allocation-underwriting.json --output docs/portfolio/allocation-underwriting
          uv run pvc operating-plan --input data/constructed/progress/allocation-plan.json --underwriting data/constructed/progress/allocation-underwriting.json --output docs/portfolio/allocation-operating-plan
          uv run pvc decision-memo --brief data/constructed/progress/allocation-brief.json --facts data/public/progress/financial-facts.json --growth data/public/progress/growth-context.json --peers data/public/progress/peer-context.json --underwriting data/constructed/progress/allocation-underwriting.json --operating-plan data/constructed/progress/allocation-plan.json --balances data/public/progress/balance-facts.json --valuation data/constructed/progress/historical-valuation.json --output docs/portfolio/allocation-memo --case-review docs/portfolio/allocation-review.json
          uv run pvc decision-memo --brief data/constructed/progress/allocation-brief.json --facts data/public/progress/financial-facts.json --growth data/public/progress/growth-context.json --peers data/public/progress/peer-context.json --underwriting data/constructed/progress/allocation-underwriting.json --operating-plan data/constructed/progress/allocation-plan.json --balances data/public/progress/balance-facts.json --valuation data/constructed/progress/historical-valuation.json --output docs/portfolio/allocation-lineage-memo --case-review docs/portfolio/allocation-lineage-review.json
          uv run python scripts/check_allocation_review.py --output var/browser-checks/allocation-review.json
          uv run python scripts/check_allocation_review.py --include-lineage --output var/browser-checks/allocation-lineage-review.json
          uv run python scripts/check_progress_review.py --output var/browser-checks/progress-review.json
          docker build -f infra/Dockerfile.browser -t pvc-browser-check .
          mkdir -p var/browser-checks
          docker run --rm --network none -v "$PWD/docs:/site:ro" -v "$PWD/var/browser-checks:/artifacts" pvc-browser-check /site /artifacts
      - name: Check fictional private finance review across desktop, tablet and phone widths
        run: |
          uv run python tests/browser/capture_private_review.py var/private-review-workspace/site
          mkdir -p var/browser-checks/private-review
          docker run --rm --network none --entrypoint python -v "$PWD/var/private-review-workspace/site:/site:ro" -v "$PWD/var/browser-checks/private-review:/artifacts" -v "$PWD/scripts/check_private_review_browser.py:/check-private.py:ro" pvc-browser-check /check-private.py /site /artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-acceptance
          path: var/browser-checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-acceptance
          path: var/local-showcase/http-acceptance.json
      - name: Stop the isolated stack
        if: always()
        run: uv run python scripts/showcase.py down

  lint:
    runs-on: ubuntu-latest
    env:
      PVC_ENV: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m pe_value_os.skills_lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pvc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PVC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pvc_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Migrations upgrade/downgrade round trip
        run: uv run python -m pe_value_os.db.migrate_check
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Dependency audit
        run: uv export --frozen --no-hashes --extra server --extra research --no-emit-project > requirements-audit.txt && uv run pip-audit -r requirements-audit.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    runs-on: ubuntu-latest
    needs: test
    env:
      PVC_ENV: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Deterministic eval gate
        run: uv run pvc eval --suite all --gate --report var/eval-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report
          path: var/eval-report.*

  package-smoke:
    runs-on: ubuntu-latest
    env:
      PVC_ENV: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Build and install the distribution with locked runtime dependencies
        run: |
          uv build
          uv export --frozen --extra server --no-dev --no-emit-project > /tmp/pvc-runtime.txt
          uv venv /tmp/pvc-installed
          uv pip sync --python /tmp/pvc-installed/bin/python /tmp/pvc-runtime.txt
          uv pip install --python /tmp/pvc-installed/bin/python --no-deps dist/*.whl
      - name: Run the installed demo and eval gate outside the checkout
        run: |
          mkdir /tmp/pvc-package-smoke
          cd /tmp/pvc-package-smoke
          /tmp/pvc-installed/bin/pvc demo --quiet
          /tmp/pvc-installed/bin/pvc public-diligence --input "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --growth "$GITHUB_WORKSPACE/data/public/progress/growth-context.json" --peers "$GITHUB_WORKSPACE/data/public/progress/peer-context.json" --output public-baseline
          /tmp/pvc-installed/bin/pvc underwriting --input "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --output underwriting
          /tmp/pvc-installed/bin/pvc operating-plan --input "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --output operating-plan
          /tmp/pvc-installed/bin/pvc case-history-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --output case-history
          /tmp/pvc-installed/bin/pvc realization-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --exercise "$GITHUB_WORKSPACE/data/constructed/progress/realization.json" --output realization
          /tmp/pvc-installed/bin/pvc execution-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --realization "$GITHUB_WORKSPACE/data/constructed/progress/realization.json" --execution "$GITHUB_WORKSPACE/data/constructed/progress/execution.json" --output execution
          /tmp/pvc-installed/bin/pvc operating-sources --sources "$GITHUB_WORKSPACE/data/constructed/progress/operating-sources.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --output operating-sources
          /tmp/pvc-installed/bin/pvc source-review-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --realization "$GITHUB_WORKSPACE/data/constructed/progress/realization.json" --execution "$GITHUB_WORKSPACE/data/constructed/progress/execution.json" --sources "$GITHUB_WORKSPACE/data/constructed/progress/operating-sources.json" --output source-review
          /tmp/pvc-installed/bin/pvc exit-review-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --realization "$GITHUB_WORKSPACE/data/constructed/progress/realization.json" --execution "$GITHUB_WORKSPACE/data/constructed/progress/execution.json" --sources "$GITHUB_WORKSPACE/data/constructed/progress/operating-sources.json" --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --valuation "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --assumptions "$GITHUB_WORKSPACE/data/constructed/progress/exit-assumptions.json" --output exit-review
          /tmp/pvc-installed/bin/pvc lineage-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --realization "$GITHUB_WORKSPACE/data/constructed/progress/realization.json" --execution "$GITHUB_WORKSPACE/data/constructed/progress/execution.json" --sources "$GITHUB_WORKSPACE/data/constructed/progress/operating-sources.json" --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --valuation "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --assumptions "$GITHUB_WORKSPACE/data/constructed/progress/exit-assumptions.json" --output lineage-review
          /tmp/pvc-installed/bin/pvc disclosure-history --input "$GITHUB_WORKSPACE/data/public/progress/sharefile-allocation-history.json" --output disclosure-history
          /tmp/pvc-installed/bin/pvc restatement-history --input "$GITHUB_WORKSPACE/data/public/progress/accounting-restatement-history.json" --output accounting-restatement
          /tmp/pvc-installed/bin/pvc historical-valuation --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --spec "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --output historical-valuation
          /tmp/pvc-installed/bin/pvc decision-memo --brief "$GITHUB_WORKSPACE/data/constructed/progress/decision-brief.json" --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --growth "$GITHUB_WORKSPACE/data/public/progress/growth-context.json" --peers "$GITHUB_WORKSPACE/data/public/progress/peer-context.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/operating-plan.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --valuation "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --output decision-memo --case-review lineage-review.json
          /tmp/pvc-installed/bin/pvc allocation-demo --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/allocation-plan.json" --exercise "$GITHUB_WORKSPACE/data/constructed/progress/allocation-realization.json" --sources "$GITHUB_WORKSPACE/data/constructed/progress/allocation-sources.json" --output allocation-review
          /tmp/pvc-installed/bin/pvc allocation-demo --include-lineage --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/allocation-plan.json" --exercise "$GITHUB_WORKSPACE/data/constructed/progress/allocation-realization.json" --sources "$GITHUB_WORKSPACE/data/constructed/progress/allocation-sources.json" --output allocation-lineage-review
          /tmp/pvc-installed/bin/pvc underwriting --input "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --output allocation-underwriting
          /tmp/pvc-installed/bin/pvc operating-plan --input "$GITHUB_WORKSPACE/data/constructed/progress/allocation-plan.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --output allocation-operating-plan
          /tmp/pvc-installed/bin/pvc decision-memo --brief "$GITHUB_WORKSPACE/data/constructed/progress/allocation-brief.json" --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --growth "$GITHUB_WORKSPACE/data/public/progress/growth-context.json" --peers "$GITHUB_WORKSPACE/data/public/progress/peer-context.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/allocation-plan.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --valuation "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --output allocation-memo --case-review allocation-review.json
          /tmp/pvc-installed/bin/pvc decision-memo --brief "$GITHUB_WORKSPACE/data/constructed/progress/allocation-brief.json" --facts "$GITHUB_WORKSPACE/data/public/progress/financial-facts.json" --growth "$GITHUB_WORKSPACE/data/public/progress/growth-context.json" --peers "$GITHUB_WORKSPACE/data/public/progress/peer-context.json" --underwriting "$GITHUB_WORKSPACE/data/constructed/progress/allocation-underwriting.json" --operating-plan "$GITHUB_WORKSPACE/data/constructed/progress/allocation-plan.json" --balances "$GITHUB_WORKSPACE/data/public/progress/balance-facts.json" --valuation "$GITHUB_WORKSPACE/data/constructed/progress/historical-valuation.json" --output allocation-lineage-memo --case-review allocation-lineage-review.json
          /tmp/pvc-installed/bin/pvc eval --suite all --gate --report eval-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-package-evidence
          path: /tmp/pvc-package-smoke/
      - name: Record package checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/

  container-scan:
    # PVC-096: build the production image and fail on all HIGH/CRITICAL vulnerabilities, including unfixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --pull --tag "pvc:ci-${GITHUB_SHA}" .
      - name: Import runtime entrypoints without development dependencies
        run: >-
          docker run --rm -e PVC_ENV=dev "pvc:ci-${GITHUB_SHA}"
          python -c 'import pe_value_os.mcp_server; import pe_value_os.api.app; import pe_value_os.worker'
      - name: Run the complete synthetic demo in the built image
        run: docker run --rm -e PVC_ENV=dev --workdir /tmp "pvc:ci-${GITHUB_SHA}" pvc demo --quiet
      - name: Build local PostgreSQL image
        run: docker build --pull --file infra/docker/Postgres.Dockerfile --tag "pvc-db:ci-${GITHUB_SHA}" .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvc:ci-${{ github.sha }}
          scan-type: image
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: trivy-image.json
          version: v0.70.0
      - name: Scan local PostgreSQL image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvc-db:ci-${{ github.sha }}
          scan-type: image
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: trivy-database.json
          version: v0.70.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-vulnerability-report
          path: trivy-*.json
