# Continuous delivery (PVC-133): build -> scan -> push -> migrate -> deploy -> smoke test.
# When PVC_ENABLE_CD=true, staging deploys on every push to main. Production runs the same steps with the same image
# after a required reviewer approves the GitHub `production` environment.
#
# AWS access is OIDC only (no static keys): each job assumes the deploy role of its own account, and that
# role trusts only this repository's matching GitHub environment (infra/terraform/modules/pvc/iam.tf).
# Per-environment variables (Settings -> Environments -> staging|production -> Variables) come from
# `terraform output github_environment_variables`:
#   AWS_REGION, AWS_DEPLOY_ROLE, ECR_REPOSITORY_URL, ECS_CLUSTER, TASK_FAMILY_PREFIX, MCP_URL, API_URL
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half way (migrations may be running); queue instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Require successful exact-SHA CI
    if: github.ref == 'refs/heads/main' && vars.PVC_ENABLE_CD == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash infra/scripts/verify-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify-ci
    name: Build and scan image
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        id: build
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "pvc:${GITHUB_SHA}" .
          echo "image-id=$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"
          echo "artifact-name=pvc-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # All HIGH/CRITICAL findings block release, including those without an upstream fix.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvc:${{ github.sha }}
          scan-type: image
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          version: v0.70.0

      - name: Save image
        run: docker save "pvc:${GITHUB_SHA}" | gzip > pvc-image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: pvc-image.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging
    needs: build
    outputs:
      manifest-digest: ${{ steps.push.outputs.manifest-digest }}
    # workflow_dispatch can run from any branch; only main is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
      MCP_URL: ${{ vars.MCP_URL }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Load image (the exact image that was scanned)
        run: |
          gunzip -c pvc-image.tar.gz | docker load
          actual="$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")"
          if [ "$actual" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::image id $actual does not match scanned image $EXPECTED_IMAGE_ID"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pvc-cd-staging-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        id: push
        run: |
          image="$(bash infra/scripts/deploy.sh push "pvc:${GITHUB_SHA}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "manifest-digest=${image##*@}" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash infra/scripts/deploy.sh deploy "$IMAGE"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra server
      - name: Smoke test
        env:
          PVC_SMOKE_COMPANY: ${{ vars.PVC_SMOKE_COMPANY }}
          PVC_SMOKE_MCP_TOKEN: ${{ secrets.PVC_SMOKE_MCP_TOKEN }}
          PVC_SMOKE_API_TOKEN: ${{ secrets.PVC_SMOKE_API_TOKEN }}
        run: bash infra/scripts/smoke.sh

  deploy-production:
    name: Deploy production
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers are configured on the `production` environment; this job waits for approval.
    environment:
      name: production
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
      MCP_URL: ${{ vars.MCP_URL }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_MANIFEST_DIGEST: ${{ needs.deploy-staging.outputs.manifest-digest }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Load image (the exact image that was scanned and verified in staging)
        run: |
          gunzip -c pvc-image.tar.gz | docker load
          actual="$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")"
          if [ "$actual" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::image id $actual does not match scanned image $EXPECTED_IMAGE_ID"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pvc-cd-production-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        id: push
        run: |
          image="$(bash infra/scripts/deploy.sh push "pvc:${GITHUB_SHA}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "manifest-digest=${image##*@}" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash infra/scripts/deploy.sh deploy "$IMAGE"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra server
      - name: Smoke test
        env:
          PVC_SMOKE_COMPANY: ${{ vars.PVC_SMOKE_COMPANY }}
          PVC_SMOKE_MCP_TOKEN: ${{ secrets.PVC_SMOKE_MCP_TOKEN }}
          PVC_SMOKE_API_TOKEN: ${{ secrets.PVC_SMOKE_API_TOKEN }}
        run: bash infra/scripts/smoke.sh
