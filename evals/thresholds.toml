# Evaluation gate thresholds (PVC-083). Changing a threshold needs review like any policy change.

[golden]                        # deterministic pipeline: every dimension must be perfect
case_pass_rate = 1.0
tool_correctness = 1.0
evidence_fidelity = 1.0
calculation_fidelity = 1.0
permission_fidelity = 1.0
uncertainty_calibration = 1.0
recovery = 1.0

[adversarial]
fail_closed_rate = 1.0

[latency]
p95_run_ms = 15000              # per-case wall clock on CI hardware

[model]                         # live-model mode (`--proposer model`), not gated in CI
planted_lever_recall = 0.8
citation_validity = 1.0
max_rejection_rate = 0.3
max_cost_usd_per_run = 2.0
