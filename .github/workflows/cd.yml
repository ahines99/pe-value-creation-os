# Continuous delivery (PVC-133): build -> scan -> push -> migrate -> deploy -> smoke test.
# Staging deploys automatically on every push to main. Production runs the same steps with the same image
# after a required reviewer approves the GitHub `production` environment.
#
# AWS access is OIDC only (no static keys): each job assumes the deploy role of its own account, and that
# role trusts only this repository's matching GitHub environment (infra/terraform/modules/pvc/iam.tf).
# Per-environment variables (Settings -> Environments -> staging|production -> Variables) come from
# `terraform output github_environment_variables`:
#   AWS_REGION, AWS_DEPLOY_ROLE, ECR_REPOSITORY_URL, ECS_CLUSTER, TASK_FAMILY_PREFIX, MCP_URL, API_URL
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half way (migrations may be running); queue instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and scan image
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        id: build
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "pvc:${GITHUB_SHA}" .
          echo "image-id=$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      # HIGH/CRITICAL findings with an available fix fail the release (PVC-096). Unfixed OS findings are
      # reported but cannot be remediated by rebuilding, so they do not block.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pvc:${{ github.sha }}
          scan-type: image
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.70.0

      - name: Save image
        run: docker save "pvc:${GITHUB_SHA}" | gzip > pvc-image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pvc-image
          path: pvc-image.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging
    needs: build
    # workflow_dispatch can run from any branch; only main is ever deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
      MCP_URL: ${{ vars.MCP_URL }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pvc-image

      - name: Load image (the exact image that was scanned)
        run: |
          gunzip -c pvc-image.tar.gz | docker load
          actual="$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")"
          if [ "$actual" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::image id $actual does not match scanned image $EXPECTED_IMAGE_ID"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pvc-cd-staging-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        id: push
        run: |
          image="$(bash infra/scripts/deploy.sh push "pvc:${GITHUB_SHA}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash infra/scripts/deploy.sh deploy "$IMAGE"

      - name: Smoke test
        run: bash infra/scripts/smoke.sh

  deploy-production:
    name: Deploy production
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers are configured on the `production` environment; this job waits for approval.
    environment:
      name: production
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
      MCP_URL: ${{ vars.MCP_URL }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pvc-image

      - name: Load image (the exact image that was scanned and verified in staging)
        run: |
          gunzip -c pvc-image.tar.gz | docker load
          actual="$(docker image inspect --format '{{.Id}}' "pvc:${GITHUB_SHA}")"
          if [ "$actual" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::image id $actual does not match scanned image $EXPECTED_IMAGE_ID"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pvc-cd-production-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image
        id: push
        run: |
          image="$(bash infra/scripts/deploy.sh push "pvc:${GITHUB_SHA}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash infra/scripts/deploy.sh deploy "$IMAGE"

      - name: Smoke test
        run: bash infra/scripts/smoke.sh
